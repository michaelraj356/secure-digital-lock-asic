yaml_version: 6

project:
  title:       "Secure Digital Lock System"
  author:      "Michael Raj"
  description: "4-digit FSM-based digital lock with auto-lock and lockout after 3 failed attempts"
  language:    "Verilog"
  clock_hz:    10000000
  tiles:       "1x1"
  top_module:  "tt_um_secure_lock"
  source_files:
    - "src/secure_lock.v"

pinout:
  ui:
    - "digit0 (in[0])"
    - "digit1 (in[1])"
    - "digit2 (in[2])"
    - "digit3 (in[3])"
    - "enter"
    - ""
    - ""
    - ""
  uo:
    - "unlock_led"
    - "error_led"
    - "lockout_led"
    - ""
    - ""
    - ""
    - ""
    - ""
  uio:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
